[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "data-qd-176"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
soil-water = "irrigation.cli:main"
soil-water-plan = "irrigation.plan_cli:plan_main"
soil-water-ledger = "irrigation.ledger_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
